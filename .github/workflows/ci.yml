name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "codex/**"

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Package build
        run: npm run package

      - name: Verify VSIX contents
        run: npx --no-install vsce ls --no-dependencies
